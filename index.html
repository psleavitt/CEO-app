  --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  --rad:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink);background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:80px}
h1,h2,h3{font-weight:600}
.mono{font-family:var(--mono)}
.hidden{display:none!important}

/* ---------- letterhead masthead ---------- */
.masthead{padding:calc(18px + env(safe-area-inset-top)) 20px 0;text-align:center}
.mast-rule{height:2px;background:var(--gold);margin:0 auto 3px;max-width:520px}
.mast-rule.thin{height:1px;background:var(--line);margin-top:3px}
.mast-name{font-size:21px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  padding:10px 0 2px;line-height:1.25}
.mast-sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--steel);padding-bottom:10px}
.mast-motto{font-size:12.5px;font-style:italic;color:var(--steel);padding:8px 0 2px}

/* ---------- health index + board strip ---------- */
.chi-wrap{display:flex;align-items:baseline;justify-content:center;gap:10px;padding:16px 0 4px}
.chi-num{font-family:var(--mono);font-size:52px;font-weight:600;line-height:1;color:var(--gold)}
.chi-label{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--steel)}
.board-strip{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:10px 16px 4px}
.bs-chip{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:4px 10px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--steel)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.on{background:var(--up)} .dot.risk{background:var(--warn)} .dot.off{background:var(--down)} .dot.na{background:var(--off)}

/* ---------- generic ---------- */
.page{max-width:640px;margin:0 auto;padding:8px 16px 24px}
.sec-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--steel);margin:22px 2px 8px;display:flex;align-items:center;gap:8px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:14px;margin-bottom:10px}
.card.tappable:active{background:var(--panel2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{background:var(--gold);color:#0C1220;font-weight:600;border-radius:8px;padding:11px 18px;font-size:14px}
.btn:active{opacity:.85}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn.small{padding:6px 12px;font-size:12.5px}
.btn.danger{background:none;border:1px solid rgba(242,85,90,.45);color:var(--down)}
.muted{color:var(--steel);font-size:13px}
.tiny{font-family:var(--mono);font-size:11px;color:var(--steel)}

/* ---------- dept cards on summary ---------- */
.dept-card{display:block;width:100%;text-align:left}
.dept-name{font-size:15px;font-weight:600}
.dept-kpi-line{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;gap:8px}
.dkl-name{color:var(--steel);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkl-val{font-family:var(--mono);font-size:13.5px;white-space:nowrap}
.delta-up{color:var(--up)} .delta-down{color:var(--down)}

/* ---------- KPI cards ---------- */
.kpi-card .kpi-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.kpi-name{font-weight:600;font-size:14.5px}
.kpi-meta{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel-dim);margin-top:2px}
.kpi-mid{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;gap:12px}
.kpi-val{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1}
.kpi-val .unit{font-size:12px;color:var(--steel);font-weight:400;margin-left:3px}
.kpi-target{font-family:var(--mono);font-size:11px;color:var(--steel);text-align:right}
.spark{display:block;margin-top:10px;width:100%;height:34px}
.kpi-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.status-pill{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;border:1px solid}
.st-on{color:var(--up);border-color:rgba(61,214,140,.4)}
.st-risk{color:var(--warn);border-color:rgba(232,185,62,.4)}
.st-off{color:var(--down);border-color:rgba(242,85,90,.4)}
.st-na{color:var(--off);border-color:var(--line)}

/* ---------- lists (goals/responsibilities/values) ---------- */
.check-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.check-item:last-child{border-bottom:0}
.check-box{width:20px;height:20px;border:1.5px solid var(--steel-dim);border-radius:5px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#0C1220}
.check-box.done{background:var(--gold);border-color:var(--gold)}
.check-text{flex:1;font-size:14px}
.check-text.done{color:var(--steel-dim);text-decoration:line-through}
.x-btn{color:var(--steel-dim);font-size:16px;padding:4px 8px}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row input{flex:1}

/* ---------- charter ---------- */
.charter-doc{border:1px solid var(--line);border-radius:var(--rad);background:var(--panel);
  padding:20px 18px;position:relative}
.charter-doc::before{content:'';position:absolute;inset:6px;border:1px solid rgba(201,162,39,.25);
  border-radius:6px;pointer-events:none}
.ch-field{margin-bottom:18px;position:relative;z-index:1}
.ch-label{font-family:var(--mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--gold);margin-bottom:6px;text-align:center}
.ch-text{font-size:15px;text-align:center;line-height:1.55;white-space:pre-wrap}
.ch-text.empty{color:var(--steel-dim);font-style:italic}
.ch-values{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ch-value-chip{border:1px solid var(--gold);color:var(--gold);border-radius:999px;
  padding:4px 12px;font-size:12.5px;letter-spacing:.04em}
.ch-seal{text-align:center;margin-top:6px;position:relative;z-index:1}
.seal-line{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--steel);text-transform:uppercase}

/* ---------- board ---------- */
.pkt-dept{margin-bottom:4px;font-weight:600;font-size:14px;margin-top:14px}
.pkt-row{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:12px;
  padding:5px 0;border-bottom:1px solid var(--line);align-items:center}
.pkt-row:last-child{border-bottom:0}
.pkt-kpi{color:var(--steel);flex:1;font-family:var(--sans);font-size:13px}
.meeting-item{cursor:pointer}

/* ---------- tabs ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(12,18,32,.92);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:50}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;
  color:var(--steel-dim);font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}
.tab.active{color:var(--gold)}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(5,8,15,.7);z-index:100;display:flex;
  align-items:flex-end;justify-content:center}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;
  max-width:640px;max-height:88vh;overflow-y:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.modal h3{margin-bottom:14px;font-size:16px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--steel);margin-bottom:5px}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions .btn{flex:1}

/* ---------- onboarding ---------- */
.onboard{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:32px;text-align:center}
.ob-bars{margin-bottom:26px}
.ob-title{font-size:13px;font-family:var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.ob-lead{font-size:19px;font-weight:600;margin-bottom:6px}
.ob-sub{color:var(--steel);font-size:14px;margin-bottom:26px;max-width:380px}
.ob-input{max-width:320px;text-align:center;font-size:17px;margin-bottom:16px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  background:var(--panel2);border:1px solid var(--gold);color:var(--ink);border-radius:8px;
  padding:9px 18px;font-size:13px;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.sync-dot{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:60;
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--steel-dim);text-transform:uppercase}
.income-row{display:grid;grid-template-columns:1fr 90px 32px;gap:8px;align-items:center;padding:6px 0;
  border-bottom:1px solid var(--line);font-size:13.5px}
.income-row:last-child{border-bottom:0}
.asset-cat{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel-dim)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="app"></div>

<nav class="tabbar" id="tabbar">
  <button class="tab active" data-tab="summary">
    <svg viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="8"/><rect x="10" y="8" width="4" height="12"/><rect x="17" y="4" width="4" height="16"/></svg>
    Summary</button>
  <button class="tab" data-tab="depts">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>
    Depts</button>
  <button class="tab" data-tab="board">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 10h8M8 14h5"/></svg>
    Board</button>
  <button class="tab" data-tab="charter">
    <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h6M9 16h6"/></svg>
    Charter</button>
  <button class="tab" data-tab="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
    Admin</button>
</nav>

<div class="toast" id="toast"></div>
<div class="sync-dot" id="syncDot"></div>

<script>
'use strict';
/* ================= CONFIG ================= */
const SUPABASE_URL = 'https://ctxnyfgdiugzhskumqpm.supabase.co';
// Paste the shared anon key here (same one embedded in your other apps).
// Sync stays quietly disabled until this is set.
const SUPABASE_ANON_KEY = '';
const SYNC_TABLE = 'ceo_state';
const LS_KEY = 'ceo_state_v1';

/* ================= STATE ================= */
const DEPT_DEFS = [
  {id:'finance',   name:'Finance'},
  {id:'health',    name:'Health'},
  {id:'hr',        name:'Human Resources'},
  {id:'spiritual', name:'Spiritual'},
  {id:'operations',name:'Operations'},
  {id:'leisure',   name:'Leisure'},
  {id:'rd',        name:'Research & Development'},
];

function seedKPIs(){
  // {id, dept, name, unit, cadence: week|month|quarter|year, agg: sum|latest, dir: up|down, target, linked, entries:[{d,v}]}
  const mk=(id,dept,name,unit,cadence,agg,dir,target,linked)=>({id,dept,name,unit,cadence,agg,dir,target,linked:!!linked,entries:[]});
  return [
    mk('networth','finance','Net Worth','$','month','latest','up',null),
    mk('income','finance','Monthly Income','$','month','sum','up',null),
    mk('expenses','finance','Monthly Expenses','$','month','sum','down',null),
    mk('savingsrate','finance','Savings Rate','%','month','latest','up',20),
    mk('workouts','health','Workouts','/wk','week','sum','up',4,'rack'),
    mk('bodyweight','health','Body Weight','lb','week','latest','down',null,'rack'),
    mk('temple','spiritual','Temple Worship','/wk','week','sum','up',1,'firstlight'),
    mk('study','spiritual','Gospel Study Days','/wk','week','sum','up',7,'firstlight'),
    mk('checkins','hr','Nightly Check-ins','/wk','week','sum','up',7,'firstlight'),
    mk('daughter11','hr','1:1 Time — Daughters','/mo','month','sum','up',4),
    mk('overdue','operations','Overdue Household Tasks','','week','latest','down',0,'gtd'),
    mk('tasksdone','operations','Tasks Completed','/wk','week','sum','up',10,'gtd'),
    mk('hobby','leisure','Hobby Hours','hrs/wk','week','sum','up',3),
    mk('trips','leisure','Trips Taken','YTD','year','sum','up',2),
    mk('books','rd','Books Completed','YTD','year','sum','up',6),
    mk('courses','rd','Courses in Progress','','quarter','latest','up',1),
  ];
}

function freshState(name){
  return {
    v:1, revision:0, name:name||'', incorporatedAt: todayStr(),
    charter:{mission:'',motto:'',values:[],vocation:'',passion:''},
    depts: DEPT_DEFS.map(d=>({...d, goals:[], resps:[]})), // goals:[{t,done}], resps:[{t}]
    kpis: seedKPIs(),
    assets: [],           // {id,name,cat,value}  cat: cash|investments|realestate|other|liability
    incomes: [],          // {id,month:'2026-08',source,amount}
    meetings: [],         // {q:'2026-Q3',date,packet:[...],notes:{deptId:txt},memo}
    settings:{syncCode:'',conn:{rack:'',firstlight:'',gtd:''}},
  };
}

let S = load();
function load(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
function persist(){ S.revision=(S.revision||0)+1; localStorage.setItem(LS_KEY, JSON.stringify(S)); schedulePush(); }

/* ================= DATE HELPERS ================= */
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(s){ const [y,m,d]=s.split('-'); return `${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]} ${+d}, ${y}`; }
function weekStart(d){ const dt=new Date(d+'T12:00:00'); const day=dt.getDay(); dt.setDate(dt.getDate()-day); return dt.toISOString().slice(0,10); } // Sunday-start
function monthKey(d){ return d.slice(0,7); }
function quarterKey(d){ const m=+d.slice(5,7); return d.slice(0,4)+'-Q'+(Math.floor((m-1)/3)+1); }
function yearKey(d){ return d.slice(0,4); }
function periodKey(kpi,d){ return kpi.cadence==='week'?weekStart(d):kpi.cadence==='month'?monthKey(d):kpi.cadence==='quarter'?quarterKey(d):yearKey(d); }
function curQuarter(){ return quarterKey(todayStr()); }
function periodLabel(c){ return c==='week'?'this week':c==='month'?'this month':c==='quarter'?'this quarter':'this year'; }

/* ================= KPI MATH ================= */
function periodSeries(kpi, n=12){
  // returns [{k, v}] last n periods (with data), chronological
  const map={};
  for(const e of kpi.entries){ const k=periodKey(kpi,e.d);
    if(kpi.agg==='sum'){ map[k]=(map[k]||0)+e.v; }
    else { if(!map[k]||e.d>=map[k].d) map[k]={d:e.d,v:e.v}; } }
  const keys=Object.keys(map).sort();
  return keys.slice(-n).map(k=>({k, v: kpi.agg==='sum'?map[k]:map[k].v}));
}
function currentValue(kpi){
  const k=periodKey(kpi,todayStr());
  const ser=periodSeries(kpi,60);
  const hit=ser.find(s=>s.k===k);
  if(hit) return hit.v;
  if(kpi.agg==='latest' && ser.length) return ser[ser.length-1].v; // carry forward latest
  return null;
}
function prevValue(kpi){
  const k=periodKey(kpi,todayStr());
  const ser=periodSeries(kpi,60).filter(s=>s.k!==k);
  return ser.length?ser[ser.length-1].v:null;
}
function kpiStatus(kpi){
  const v=currentValue(kpi);
  if(v===null) return 'na';
  if(kpi.target===null||kpi.target===undefined||kpi.target==='') return 'na';
  const t=+kpi.target;
  let pct;
  if(kpi.dir==='up'){ pct = t===0 ? (v>0?100:0) : v/t*100; }
  else { pct = v<=t ? 100 : (v===0?100: t===0 ? (v<=0?100:40) : t/v*100); }
  return pct>=100?'on':pct>=70?'risk':'off';
}
function deptStatus(deptId){
  const ks=S.kpis.filter(k=>k.dept===deptId);
  const sts=ks.map(kpiStatus).filter(s=>s!=='na');
  if(!sts.length) return 'na';
  if(sts.includes('off')) return 'off';
  if(sts.includes('risk')) return 'risk';
  return 'on';
}
function healthIndex(){
  const score={on:100,risk:60,off:20};
  const vals=S.depts.map(d=>deptStatus(d.id)).filter(s=>s!=='na').map(s=>score[s]);
  if(!vals.length) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function fmtVal(kpi,v){
  if(v===null||v===undefined) return '—';
  const n = Math.abs(v)>=1000 ? v.toLocaleString('en-US',{maximumFractionDigits:0}) : (+v.toFixed(2)).toString();
  return kpi.unit==='$' ? '$'+n : n;
}

/* ================= SPARKLINE ================= */
function sparkSVG(kpi){
  const ser=periodSeries(kpi,12);
  if(ser.length<2) return '';
  const vs=ser.map(s=>s.v);
  const min=Math.min(...vs), max=Math.max(...vs);
  const W=200,H=34,P=3;
  const x=i=>P+i*(W-2*P)/(ser.length-1);
  const y=v=>max===min?H/2:H-P-(v-min)*(H-2*P)/(max-min);
  const pts=vs.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const good = kpi.dir==='up' ? vs[vs.length-1]>=vs[0] : vs[vs.length-1]<=vs[0];
  const col = good?'var(--up)':'var(--down)';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" opacity=".9"/>
    <circle cx="${x(vs.length-1)}" cy="${y(vs[vs.length-1])}" r="2.4" fill="${col}"/></svg>`;
}

/* ================= RENDER ================= */
const app=document.getElementById('app');
let TAB='summary', VIEW=null; // VIEW: {type:'dept', id} or {type:'meeting', q}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(){
  if(!S){ renderOnboard(); return; }
  document.getElementById('tabbar').style.display='flex';
  if(VIEW&&VIEW.type==='dept'){ renderDept(VIEW.id); return; }
  if(VIEW&&VIEW.type==='meeting'){ renderMeeting(VIEW.q, VIEW.readonly); return; }
  ({summary:renderSummary, depts:renderDepts, board:renderBoard, charter:renderCharter, settings:renderSettings})[TAB]();
}

function masthead(withStrip){
  const hi=healthIndex();
  return `
  <div class="masthead">
    <div class="mast-rule"></div><div class="mast-rule thin"></div>
    <div class="mast-name">${esc(S.name)} Corporation</div>
    <div class="mast-sub">Est. ${fmtDate(S.incorporatedAt)} &nbsp;·&nbsp; Office of the CEO</div>
    <div class="mast-rule thin"></div>
    ${S.charter.motto?`<div class="mast-motto">“${esc(S.charter.motto)}”</div>`:''}
    ${withStrip?`
      <div class="chi-wrap"><span class="chi-num">${hi===null?'—':hi}</span><span class="chi-label">Company<br>Health Index</span></div>
      <div class="board-strip">${S.depts.map(d=>`<span class="bs-chip"><span class="dot ${deptStatus(d.id)}"></span>${esc(shortName(d.name))}</span>`).join('')}</div>
    `:''}
  </div>`;
}
function shortName(n){ return n==='Human Resources'?'HR':n==='Research & Development'?'R&D':n; }

/* ---------- SUMMARY ---------- */
function renderSummary(){
  const cards=S.depts.map(d=>{
    const ks=S.kpis.filter(k=>k.dept===d.id).slice(0,3);
    const lines=ks.map(k=>{
      const cur=currentValue(k), prev=prevValue(k);
      let delta='';
      if(cur!==null&&prev!==null&&prev!==cur){
        const upGood=k.dir==='up';
        const rising=cur>prev;
        const good=(rising&&upGood)||(!rising&&!upGood);
        delta=` <span class="${good?'delta-up':'delta-down'}">${rising?'▲':'▼'}</span>`;
      }
      return `<div class="dept-kpi-line"><span class="dkl-name">${esc(k.name)}</span>
        <span class="dkl-val">${fmtVal(k,cur)}${k.target!=null&&k.target!==''?` <span class="tiny">/ ${fmtVal(k,+k.target)}</span>`:''}${delta}</span></div>`;
    }).join('');
    return `<button class="card tappable dept-card" onclick="openDept('${d.id}')">
      <div class="row"><span class="dept-name">${esc(d.name)}</span><span class="dot ${deptStatus(d.id)}"></span></div>
      ${lines||'<div class="muted" style="margin-top:6px">No KPI data yet</div>'}
    </button>`;
  }).join('');
  app.innerHTML = masthead(true)+`<div class="page">
    <div class="sec-label">Departments</div>${cards}</div>`;
}

function saveKPI(id,dept){
  const name=g('m_name'); if(!name)return;

    cadence:g('m_cad'),agg:g('m_agg'),dir:g('m_dir')};
  if(id){ Object.assign(S.kpis.find(x=>x.id===id),fields); }
  else { S.kpis.push({id:uid(),dept,linked:false,entries:[],...fields}); }

}

function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='ceo-backup-'+todayStr()+'.json'; a.click();

function importData(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d&&d.v===1&&d.depts){ S=d; persist(); render(); toast('Imported'); }
      else toast('Not a valid CEO backup'); }catch(e){ toast('Import failed'); } };
    r.readAsText(f); };
  inp.click();
}

/* ---------- MODAL / MISC ---------- */
function openModal(html){
  const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modalBg';
  bg.innerHTML=`<div class="modal">${html}</div>`;
  bg.addEventListener('click',e=>{ if(e.target===bg) closeModal(); });
  document.body.appendChild(bg);
}
function closeModal(){ const m=document.getElementById('modalBg'); if(m)m.remove(); }
function g(id){ return document.getElementById(id).value.trim(); }
function uid(){ return Math.random().toString(36).slice(2,10); }
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

document.getElementById('tabbar').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b)return;
  TAB=b.dataset.tab; VIEW=null;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));
  render(); window.scrollTo(0,0);
});

/* ---------- SUPABASE SYNC (revision-counter pattern) ---------- */
let pushT=null, syncing=false;
function sbHeaders(){ return {'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json'}; }
function canSync(){ return SUPABASE_ANON_KEY && S && S.settings.syncCode; }
function setSyncDot(txt){ document.getElementById('syncDot').textContent=txt; }
function schedulePush(){ if(!canSync())return; clearTimeout(pushT); pushT=setTimeout(pushRemote,1500); }
async function pushRemote(){
  if(!canSync()||syncing)return; syncing=true; setSyncDot('sync…');
  try{
    const body=JSON.stringify({sync_code:S.settings.syncCode,revision:S.revision,payload:S,updated_at:new Date().toISOString()});
    const r=await fetch(`${SUPABASE_URL}/rest/v1/${SYNC_TABLE}?on_conflict=sync_code`,{
      method:'POST',headers:{...sbHeaders(),'Prefer':'resolution=merge-duplicates'},body});
    setSyncDot(r.ok?'synced':'sync err');
  }catch(e){ setSyncDot('offline'); }
  syncing=false;
}
async function pullRemote(){
  if(!canSync())return;
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/${SYNC_TABLE}?sync_code=eq.${encodeURIComponent(S.settings.syncCode)}&select=revision,payload`,{headers:sbHeaders()});
    if(!r.ok)return;
    const rows=await r.json();
    if(rows.length && rows[0].revision>(S.revision||0)){
      const localSettings=S.settings;
      S=rows[0].payload; S.settings=S.settings||localSettings;
      localStorage.setItem(LS_KEY,JSON.stringify(S));
      render(); setSyncDot('synced');
    }
  }catch(e){}
}
setInterval(pullRemote, 60000);

/* ---------- BOOT ---------- */
render();
pullRemote();
</script>
